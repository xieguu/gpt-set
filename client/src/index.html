<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>GPT Set</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header><div><h1>GPT Set</h1><p>独立浏览器环境 · 会话数据不跨环境共享</p></div><div class="header-actions"><button id="import" class="secondary">导入配置</button><button id="export" class="secondary">导出配置</button></div></header>
  <main>
    <section class="toolbar"><div class="tabs"><button class="tab active" data-filter="active">使用中</button><button class="tab" data-filter="archived">已归档</button></div><button id="add" class="primary">+ 新建环境</button></section>
    <p id="notice" role="status"></p><section class="mcp-panel"><div><strong>本地 MCP 工作区</strong><p id="mcp-workspace">正在检查服务…</p></div><div class="mcp-actions"><button id="choose-workspace" class="secondary">选择本地文件夹</button><button id="open-extension" class="secondary">打开图片桥接扩展</button></div></section>
    <section id="empty" class="empty"><h2>还没有浏览器环境</h2><p>创建一个环境，在独立窗口中手动登录你的 GPT 账号。</p><button id="empty-add" class="primary">创建首个环境</button></section>
    <section id="environment-list" class="grid" aria-live="polite"></section>
  </main>
  <dialog id="environment-dialog"><form id="environment-form" method="dialog">
    <div class="dialog-title"><h2 id="dialog-title">新建环境</h2><button type="button" class="icon" id="close-dialog" aria-label="关闭">×</button></div>
    <label>环境名称<input required maxlength="80" name="name" placeholder="例如：工作账号" /></label>
    <label>站点地址<input required name="baseUrl" type="url" value="https://chatgpt.com/" /></label>
    <div class="twocol"><label>服务类型<select name="provider"><option value="chatgpt">ChatGPT</option><option value="custom">自定义站点</option></select></label><label>代理（可选）<input name="proxy" placeholder="留空：跟随系统代理（Nano）" /></label></div>
    <div class="twocol"><label>语言<input name="locale" value="zh-CN" /></label><label>时区<input name="timezone" value="Asia/Shanghai" /></label></div>
    <p class="hint">登录数据只保存在此环境的 Chromium partition 中；复制配置不会复制登录状态。</p>
    <div class="dialog-actions"><button type="button" class="secondary" id="cancel">取消</button><button class="primary" value="default">保存环境</button></div>
  </form></dialog>
  <script src="renderer.js"></script>
</body>
</html>
